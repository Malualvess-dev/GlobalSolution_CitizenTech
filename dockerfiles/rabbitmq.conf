# Configuracao extra do RabbitMQ da Parada Certa
# O usuario guest so pode entrar por localhost (padrao do RabbitMQ); a API usa o usuario definido no deploy.
loopback_users.guest = true
# Avisa quando o disco estiver acabando, antes de parar de aceitar mensagens
disk_free_limit.absolute = 200MB
# Mensagens maiores que isto sao recusadas (o evento da solicitacao tem poucos bytes)
max_message_size = 1048576
