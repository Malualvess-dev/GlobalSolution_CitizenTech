# Perfil dev: sem Oracle, RabbitMQ ou OpenAI. Nao usar em producao.
spring:
  datasource:
    url: jdbc:h2:mem:citizentech;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sem-chave-no-perfil-dev}
    retry:
      max-attempts: 1

citizentech:
  jwt:
    secret: ${JWT_SECRET:segredo-do-perfil-dev-com-mais-de-32-bytes}
  hash:
    secret: ${HASH_SECRET:segredo-de-hash-do-perfil-dev}
  mensageria:
    modo: local

management:
  health:
    rabbit:
      enabled: false
