spring:
  application:
    name: citizentech

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  data:
    web:
      pageable:
        serialization-mode: via-dto

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.3
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 1s

  http:
    clients:
      connect-timeout: 3s
      read-timeout: 10s

citizentech:
  # rabbit (padrao) ou local (sem fila, perfil dev)
  mensageria:
    modo: ${MENSAGERIA_MODO:rabbit}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    issuer: citizentech-api
  hash:
    secret: ${HASH_SECRET}
  gestor-inicial:
    nome: ${GESTOR_NOME:Gestor}
    email: ${GESTOR_EMAIL:}
    senha: ${GESTOR_SENHA:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    nome: Parada Certa API
    versao: ${APP_VERSION:local}
    commit: ${APP_COMMIT:local}

server:
  port: ${PORT:8080}
